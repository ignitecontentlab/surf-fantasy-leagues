name: contests
# Draft rosters from the official event pages (WSL heat draws, ISA results), every 15 minutes,
# so surfers who get eliminated during a live contest stop being pickable quickly.
on:
  schedule: [{cron: "9-59/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: write, issues: write, actions: write}
concurrency: contests
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Contests and draft rosters (official WSL heat draws, WSL tour list, ISA results)
        run: python collector/contests.py
        env: {NOTIFY_FILE: /tmp/notify.md}
      - name: Save and publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name "collector"; git config user.email "bot@users.noreply.github.com"
          git add data/contests.json
          if ! git diff --cached --quiet; then
            git commit -m "contests update"
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
            gh workflow run pages -R "$GITHUB_REPOSITORY" || true
          fi
      - name: Email what changed
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          [ -s /tmp/notify.md ] || exit 0
          gh label create events-update -R "$GITHUB_REPOSITORY" --color 0e8a16 -f >/dev/null
          printf '\n\n@%s\n' "$GITHUB_REPOSITORY_OWNER" >> /tmp/notify.md
          gh issue create -R "$GITHUB_REPOSITORY" --label events-update \
            --title "Contests updated $(date -u +'%b %d %H:%M') UTC" --body-file /tmp/notify.md
          gh issue list -R "$GITHUB_REPOSITORY" --label events-update --state open --json number -q '.[1:][].number' | xargs -r -n1 gh issue close -R "$GITHUB_REPOSITORY"
