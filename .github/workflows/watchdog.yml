name: watchdog
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test alert email"
        type: boolean
        default: false
permissions: {contents: write, issues: write, actions: write}
concurrency: watchdog
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 30}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python collector/watchdog.py
        env:
          GH_TOKEN: "${{ github.token }}"
          WATCHDOG_TEST: "${{ inputs.test_email }}"
          LIVE_UNTIL: "${{ vars.LIVE_UNTIL || '2026-11-16' }}"
      - name: Save status
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name "watchdog"; git config user.email "bot@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "watchdog status"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            gh workflow run pages -R "$GITHUB_REPOSITORY" || true
          fi
