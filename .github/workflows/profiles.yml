name: profiles
# Weekly deep refresh: socials/photos, surfer bios older than 30 days, and every contest spot guide.
on:
  schedule: [{cron: "23 8 * * 1"}]
  workflow_dispatch:
permissions: {contents: write, actions: write}
concurrency: events
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python collector/socials.py
      - run: python collector/bios.py --all
      - run: python collector/places.py --all
      - name: Save and publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name "collector"; git config user.email "bot@users.noreply.github.com"
          git add data/profiles.json data/bios.json data/places.json
          if ! git diff --cached --quiet; then
            git commit -m "profiles and spot guides refresh"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            gh workflow run pages -R "$GITHUB_REPOSITORY" || true
          fi
